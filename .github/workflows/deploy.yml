# main に変更が入るたびに、テスト → ビルド → GitHub Pages へ公開する。
# ビルド結果（dist/）を gh-pages ブランチに置き、GitHub Pages がそのブランチを配信する。
# 初回だけ、リポジトリの Settings → Pages で「Deploy from a branch」→ gh-pages / (root) を選ぶ。
name: 公開（GitHub Pages）

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: gh-pages ブランチへ公開
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Jekyll の変換を止めて、ファイルをそのまま配信させる
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "公開: ${GITHUB_SHA}"
          # 公開用のブランチは毎回まるごと置き換える（履歴は main 側にある）
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
